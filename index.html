<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fc">
  <meta name="description" content="Sign in to your CareLink account.">
  <title>Sign in | CareLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --carelink-primary: #216b68;
      --carelink-primary-dark: #185653;
      --carelink-ink: #1d2b37;
      --carelink-muted: #71808e;
      --carelink-border: #e4eaf0;
      --carelink-bg: #f5f8fc;
    }

    body {
      min-height: 100vh;
      color: var(--carelink-ink);
      background:
        radial-gradient(ellipse at 12% 18%, rgb(213 239 231 / 55%), transparent 34rem),
        radial-gradient(ellipse at 90% 86%, rgb(222 234 249 / 65%), transparent 32rem),
        var(--carelink-bg);
    }

    .login-shell {
      max-width: 448px;
    }

    .brand-mark {
      display: inline-flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      color: #fff;
      background: var(--carelink-primary);
    }

    .login-card {
      border: 1px solid rgb(228 234 240 / 85%);
      border-radius: 1.25rem;
      box-shadow: 0 1.5rem 4rem rgb(35 55 75 / 10%);
    }

    .form-control {
      min-height: 48px;
      border-color: var(--carelink-border);
      border-radius: 0.65rem;
    }

    .form-control:focus {
      border-color: var(--carelink-primary);
      box-shadow: 0 0 0 0.22rem rgb(33 107 104 / 14%);
    }

    .btn-carelink {
      min-height: 48px;
      border-color: var(--carelink-primary);
      border-radius: 0.65rem;
      color: #fff;
      background: var(--carelink-primary);
      font-weight: 600;
    }

    .btn-carelink:hover,
    .btn-carelink:focus-visible {
      border-color: var(--carelink-primary-dark);
      color: #fff;
      background: var(--carelink-primary-dark);
    }

    .text-muted-carelink {
      color: var(--carelink-muted);
    }

    a {
      color: var(--carelink-primary);
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      color: var(--carelink-primary-dark);
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="login-shell w-100">
      <header class="text-center mb-4">
        <a class="d-inline-flex align-items-center gap-2 text-decoration-none" href="#" aria-label="CareLink home">
          <span class="brand-mark" aria-hidden="true">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6l1.2 1.2L12 21l7.6-7.6 1.2-1.2a5.4 5.4 0 0 0 0-7.6Z"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M5.2 12h3.2l1.5-2.5 2.2 5 1.6-2.5h5.1" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="fs-4 fw-bold" style="color: var(--carelink-ink)">CareLink</span>
        </a>
      </header>

      <section class="login-card bg-white p-4 p-sm-5" aria-labelledby="login-title">
        <div class="mb-4">
          <h1 class="h3 fw-bold mb-2" id="login-title">Welcome back</h1>
          <p class="text-muted-carelink mb-0">Sign in to continue to your account.</p>
        </div>

        <form action="#" method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">Email address</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email"
              placeholder="you@example.com" required autofocus>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label fw-semibold mb-0" for="password">Password</label>
              <a class="small" href="#">Forgot password?</a>
            </div>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password"
              placeholder="Enter your password" required>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" id="remember" name="remember" type="checkbox">
            <label class="form-check-label text-muted-carelink" for="remember">Keep me signed in</label>
          </div>

          <button class="btn btn-carelink w-100" type="submit">Sign in</button>
        </form>

        <p class="text-center text-muted-carelink mt-4 mb-0">
          New to CareLink? <a href="#">Create an account</a>
        </p>
      </section>

      <footer class="text-center mt-4">
        <small class="text-muted-carelink">Your care, connected.</small>
      </footer>
    </div>
  </main>
</body>

</html>
